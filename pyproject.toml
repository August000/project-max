[project]
name = "project-max"
version = "0.1.0"
description = "AI companion server for ESP32-S3: VAD + Whisper STT + OpenAI LLM (with emotion tags) + Gemini TTS + mem0 + robot face on TFT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.1",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "openai>=1.54.0",
    "google-genai>=1.0.0",
    "silero-vad>=5.1.0",
    "numpy>=2.0.0",
    "mem0ai>=0.1.40",
    "qdrant-client>=1.12.0",
]

[tool.uv]
package = false
